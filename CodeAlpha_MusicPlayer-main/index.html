<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="player-container">
    <div class="main-card">
      
      <div class="cover-wrapper">
        <div class="cover-art" id="coverArt">
          <svg class="placeholder-art" id="svgArt" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="100" height="100" fill="#1a1a1a"/>
            <circle cx="50" cy="50" r="32" stroke="#333333" stroke-width="4"/>
            <circle cx="50" cy="50" r="14" fill="#38bdf8"/>
          </svg>
        </div>
      </div>

      <div class="track-info">
        <h2 id="trackTitle" class="track-title">Select a Track</h2>
        <p id="trackArtist" class="track-artist">Artist</p>
      </div>

      <div class="progress-container">
        <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0" step="0.1">
        <div class="time-display">
          <span id="currentTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
      </div>

      <div class="controls-container">
        <button id="autoplayBtn" class="toggle-btn active" title="Toggle Autoplay">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 2l4 4-4 4"></path>
            <path d="M3 11v-1a4 4 0 0 1 4-4h14"></path>
            <path d="M7 22l-4-4 4-4"></path>
            <path d="M21 13v1a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>

        <button id="prevBtn" class="control-btn" title="Previous Track">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <polygon points="19,20 9,12 19,4"></polygon>
            <rect x="5" y="4" width="3" height="16"></rect>
          </svg>
        </button>

        <button id="playPauseBtn" class="control-btn play-btn" title="Play / Pause">
          <svg id="playIcon" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <polygon points="5,3 19,12 5,21"></polygon>
          </svg>
          <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
        </button>

        <button id="nextBtn" class="control-btn" title="Next Track">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <polygon points="5,4 15,12 5,20"></polygon>
            <rect x="16" y="4" width="3" height="16"></rect>
          </svg>
        </button>

        <button id="playlistToggleBtn" class="toggle-btn" title="Toggle Playlist View">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="volume-container">
        <button id="muteBtn" class="volume-btn" title="Mute/Unmute">
          <svg id="volumeHighIcon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg id="volumeMuteIcon" class="hidden" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>
        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.8">
      </div>

    </div>

    <div class="playlist-card" id="playlistCard">
      <div class="playlist-header">
        <h3>Playlist</h3>
        <span id="playlistCount" class="playlist-count">0 tracks</span>
      </div>
      <ul id="playlistTracks" class="playlist-tracks">
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
